<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Springer Fiber — Cell Attachment, Nerve & Shells</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bg:#0c0b09; --bg2:#141210; --ink:#ece6da; --dim:#8a8576;
  --gold:#c8a96e; --gold2:#e5c98f; --line:#2a2722; --core:#f0d79a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#wrap{display:flex;height:100vh;width:100vw}
#stage{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
#side{width:340px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
header{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;letter-spacing:.3px;color:var(--gold2);line-height:1.05}
h1 small{display:block;font-family:'Inter';font-weight:300;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:6px}
.controls{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
label.lab{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:5px}
select{width:100%;background:#1b1813;color:var(--ink);border:1px solid var(--line);
  padding:8px 10px;font-family:'Inter';font-size:13px;border-radius:4px;appearance:none;cursor:pointer}
select:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--dim);border:none;padding:8px 4px;
  font-family:'Inter';font-size:11.5px;letter-spacing:.3px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--gold);color:#1a150c;font-weight:600}
.body{flex:1;overflow-y:auto;padding:16px 22px}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:#2c2822;border-radius:4px}
.hint{font-size:12.5px;line-height:1.6;color:var(--dim)}
.hint b{color:var(--ink);font-weight:500}
.ctitle{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold2);margin-bottom:2px}
.csub{font-size:11px;color:var(--dim);margin-bottom:14px;letter-spacing:.3px}
.sharerow{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 0;border-bottom:1px solid #211e19;font-size:12.5px}
.sharerow .nm{font-family:'Inter';color:var(--ink)}
.sharerow .ct{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:600}
.perm{font-family:'Inter';font-size:11px;color:var(--dim);margin-top:2px;word-break:break-all}
.legend{position:absolute;left:18px;bottom:16px;font-size:11px;color:var(--dim);
  background:rgba(12,11,9,.72);border:1px solid var(--line);border-radius:6px;padding:10px 13px;line-height:1.7;backdrop-filter:blur(3px);max-width:280px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
#tip{position:absolute;pointer-events:none;background:rgba(20,18,16,.96);border:1px solid var(--gold);
  color:var(--ink);font-size:12px;padding:7px 10px;border-radius:5px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
#tip b{color:var(--gold2)}
.band-note{position:absolute;left:18px;top:14px;font-size:11px;color:var(--dim);
  background:rgba(12,11,9,.6);padding:4px 9px;border-radius:5px}
.stat{display:flex;gap:18px;margin:4px 0 16px}
.stat div{font-size:11px;color:var(--dim)}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold2);font-weight:600}
.reset{margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 12px;border-radius:5px;font-size:11px;letter-spacing:.6px;cursor:pointer;width:100%}
.reset:hover{border-color:var(--gold);color:var(--ink)}
.spinctl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-top:4px}
.spinctl input{flex:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="band-note" id="bandnote"></div>
    <div class="legend" id="legend"></div>
    <div id="tip"></div>
  </div>
  <div id="side">
    <header>
      <h1>Cell Structure<small>Springer fiber · attachment · nerve · shells</small></h1>
    </header>
    <div class="controls">
      <div>
        <label class="lab">Partition</label>
        <select id="part"></select>
      </div>
      <div>
        <label class="lab">View</label>
        <div class="seg" id="seg">
          <button data-m="attach" class="on">Attachment</button>
          <button data-m="nerve">Nerve</button>
          <button data-m="shell">Shells</button>
        </div>
      </div>
      <div class="spinctl" id="spinwrap" style="display:none">
        <span>spin</span><input id="spin" type="range" min="0" max="100" value="35">
      </div>
    </div>
    <div class="body" id="panel"></div>
  </div>
</div>

    arr.forEach((p,i)=>{
      const t=(i+0.5)/n; const phi=Math.acos(1-2*t); const th=GA*i+off;
      P3[p]={ x:r*Math.sin(phi)*Math.cos(th), y:r*Math.cos(phi), z:r*Math.sin(phi)*Math.sin(th), r };
    });
  });
  shell={P3,step,maxd,Rmax,dims,band};
}

// ---------- shared ----------
function selClosure(){
  if(sel<0) return null;
  const comp=DATA.comps[sel]; const set=new Set();
  DATA.cells.forEach(c=>{ if((DATA.sup[c.p]||[]).includes(sel)) set.add(c.p); });
  return {comp,set};
}
function T(x,y){ return [ (x-W/2)*view.s + W/2 + view.x, (y-H/2)*view.s + H/2 + view.y ]; }
function clear(){ ctx.clearRect(0,0,W,H); }

function draw(){
  clear();
  if(mode==='attach') drawAttach();
  else if(mode==='nerve') drawNerve();
  else drawShell();
}

function drawAttach(){
  const {node}=layout; const cl=selClosure();
  DATA.covers.forEach(([a,b])=>{ const A=node[a],B=node[b]; if(!A||!B)return;
    const inSel = cl && cl.set.has(a) && cl.set.has(b);
    ctx.beginPath(); const [ax,ay]=T(A.x,A.y),[bx,by]=T(B.x,B.y);
    ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    ctx.strokeStyle = cl ? (inSel?'rgba(200,169,110,.55)':'rgba(120,112,96,.05)') : C.faint;
    ctx.lineWidth = inSel?1.4:1; ctx.stroke(); });
  const coreSet=new Set(DATA.core), compSet=new Set(DATA.comps);
  DATA.cells.forEach(c=>{ const N=node[c.p]; if(!N)return;
    const [x,y]=T(N.x,N.y); const r=N.r*Math.max(.7,Math.min(view.s,1.6));
    const isCore=coreSet.has(c.p), isComp=compSet.has(c.p);
    const inSel = cl? cl.set.has(c.p):true; const isSelComp = cl && c.p===cl.comp;
    let fill,stroke=null,sw=0;
    if(cl && !inSel) fill='rgba(120,112,96,.14)';
    else if(isCore) fill=C.core;
    else if(isComp){ fill= isSelComp?C.gold2:'rgba(200,169,110,.85)'; stroke='#1a150c'; sw=1; }
    else fill= cl?'rgba(229,201,143,.75)':'rgba(180,170,150,.55)';
    if(hover===c.p){ stroke=C.gold2; sw=2; }
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill();
    if(isCore){ ctx.beginPath(); ctx.arc(x,y,r+4,0,7); ctx.strokeStyle='rgba(240,215,154,.5)'; ctx.lineWidth=1.3; ctx.stroke(); }
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=sw; ctx.stroke(); } });
  bandnote.textContent = `${layout.dims.length} dimension bands · ${DATA.cells.length} cells · top dim ${DATA.top}`;
  legend.innerHTML =
    `<span class="sw" style="background:${C.core}"></span>minimal cell (shared core)<br>`+
    `<span class="sw" style="background:${C.gold}"></span>irreducible component (top cell)<br>`+
    `<span class="sw" style="background:rgba(180,170,150,.6)"></span>intermediate cell<br>`+
    `<span style="color:#6f6a5e">rows = dimension · edges = boundary attachment</span>`;
}

function drawNerve(){
  const {npos,cx,cy}=nerveLayout; const comps=DATA.comps;
  const cset=comps.map((_,i)=>{ const s=new Set(); DATA.cells.forEach(c=>{ if((DATA.sup[c.p]||[]).includes(i)) s.add(c.p);}); return s; });
  for(let i=0;i<comps.length;i++)for(let j=i+1;j<comps.length;j++){
    let sh=0; cset[i].forEach(p=>{ if(cset[j].has(p)) sh++; }); if(!sh)continue;
    const A=npos[comps[i]],B=npos[comps[j]]; const [ax,ay]=T(A.x,A.y),[bx,by]=T(B.x,B.y);
    const act = sel===i||sel===j;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    ctx.strokeStyle= act?'rgba(200,169,110,.5)':'rgba(120,112,96,.13)';
    ctx.lineWidth= act?Math.min(4,1+sh/4):Math.min(2,.5+sh/8); ctx.stroke(); }
  const [kx,ky]=T(cx,cy);
  ctx.beginPath(); ctx.arc(kx,ky,13*Math.min(view.s,1.5),0,7); ctx.fillStyle=C.core; ctx.fill();
  ctx.beginPath(); ctx.arc(kx,ky,18*Math.min(view.s,1.5),0,7); ctx.strokeStyle='rgba(240,215,154,.4)'; ctx.lineWidth=1.3; ctx.stroke();
  comps.forEach((p,i)=>{ const N=npos[p]; const [x,y]=T(N.x,N.y); const on = sel<0||sel===i;
    ctx.beginPath(); ctx.arc(x,y,11*Math.min(view.s,1.5),0,7);
    ctx.fillStyle= sel===i?C.gold2:(on?'rgba(200,169,110,.9)':'rgba(200,169,110,.3)'); ctx.fill();
    ctx.strokeStyle='#1a150c'; ctx.lineWidth=1; ctx.stroke();
    if(hover==='N'+i){ ctx.strokeStyle=C.gold2; ctx.lineWidth=2; ctx.stroke(); } });
  bandnote.textContent = `${comps.length} irreducible components · all meet at the minimal cell`;
  legend.innerHTML =
    `<span class="sw" style="background:${C.core}"></span>shared minimal cell (common to every component)<br>`+
    `<span class="sw" style="background:${C.gold}"></span>irreducible component<br>`+
    `<span style="color:#6f6a5e">edge thickness = # cells two components share</span>`;
}

// project a 3D point with current rotation
function proj(p){
  const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
  let x=p.x*cy - p.z*sy; let z=p.x*sy + p.z*cy; let y=p.y;
  let y2=y*cx - z*sx; let z2=y*sx + z*cx;
  const fov=900*zoom3; const sc=fov/(fov+z2);
  return { sx:W/2 + x*sc, sy:H/2 + y2*sc, depth:z2, sc };
}
function drawShell(){
  const {P3,step,maxd,Rmax,dims}=shell; const cl=selClosure();
  // faint shell guide circles (a sphere projects to a circle)
  dims.forEach(d=>{ if(d===0)return; const rr=d*step* (900*zoom3)/(900*zoom3) ;
    ctx.beginPath(); ctx.arc(W/2,H/2, d*step*zoom3, 0,7);
    ctx.strokeStyle='rgba(120,112,96,.06)'; ctx.lineWidth=1; ctx.stroke(); });
  // edges (depth-shaded so the lattice reads clearly)
  const PR={}; DATA.cells.forEach(c=>PR[c.p]=proj(P3[c.p]));
  const Rm=shell.Rmax;
  ctx.lineCap='round';
  DATA.covers.forEach(([a,b])=>{ const A=PR[a],B=PR[b]; if(!A||!B)return;
    const inSel = cl && cl.set.has(a) && cl.set.has(b);
    if(cl && !inSel) return; // hide non-selected edges when a component is chosen
    const dn=Math.max(0,Math.min(1,((A.depth+B.depth)/2 + Rm)/(2*Rm))); // 0 back .. 1 front
    ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy);
    if(cl){ ctx.strokeStyle=`rgba(224,196,132,${0.45+0.5*dn})`; ctx.lineWidth=1.0+1.1*dn; }
    else  { ctx.strokeStyle=`rgba(205,176,122,${0.14+0.34*dn})`; ctx.lineWidth=0.7+0.9*dn; }
    ctx.stroke(); });
  ctx.lineCap='butt';
  // nodes depth-sorted back->front
  const coreSet=new Set(DATA.core), compSet=new Set(DATA.comps);
  const list=DATA.cells.map(c=>({c,P:PR[c.p]})).sort((u,v)=>u.P.depth-v.P.depth);
  list.forEach(({c,P})=>{
    const isCore=coreSet.has(c.p), isComp=compSet.has(c.p);
    const inSel=cl?cl.set.has(c.p):true; const isSelComp=cl&&c.p===cl.comp;
    // depth shading
    const dn=(P.depth+Rmax)/(2*Rmax); // 0 back .. 1 front
    const a=0.35+0.6*Math.max(0,Math.min(1,dn));
    let base=P.sc* (isCore?6: isComp?5.2:4.0);
    const r=Math.max(1.6,base);
    let fill,stroke=null,sw=0;
    if(cl && !inSel){ fill=`rgba(120,112,96,${0.10+0.12*dn})`; }
    else if(isCore){ fill=C.core; }
    else if(isComp){ fill= isSelComp?C.gold2:`rgba(210,180,120,${a})`; stroke='#1a150c'; sw=1; }
    else { fill= cl?`rgba(229,201,143,${0.55+0.4*dn})`:`rgba(190,178,150,${a})`; }
    if(hover===c.p){ stroke=C.gold2; sw=2; }
    if(isCore){ // glow
      const g=ctx.createRadialGradient(P.sx,P.sy,0,P.sx,P.sy,r*4);
      g.addColorStop(0,'rgba(240,215,154,.5)'); g.addColorStop(1,'rgba(240,215,154,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(P.sx,P.sy,r*4,0,7); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(P.sx,P.sy,r,0,7); ctx.fillStyle=fill; ctx.fill();
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=sw; ctx.stroke(); }
  });
  bandnote.textContent = `${dims.length} nested shells · core = dim 0 · outer shell = components · drag to rotate`;
  legend.innerHTML =
    `<span class="sw" style="background:${C.core}"></span>minimal cell at the center<br>`+
    `<span class="sw" style="background:${C.gold}"></span>components on the outer shell<br>`+
    `<span style="color:#6f6a5e">radius = dimension · each shell is one dim · edges = attachments inward</span>`;
}

// ---------- panel ----------
function renderPanel(){
  if(sel<0){
    const extra = mode==='shell'
      ? `Here the fiber is drawn as <b>nested shells</b>: the minimal cell sits at the center, and each
         dimension forms an expanding spherical layer around it — like the layers of the earth. Attachment
         edges run <b>inward</b>, from a cell toward the lower-dimensional cells in its boundary.<br><br>
         <b>Drag</b> to rotate, <b>scroll</b> to zoom. `
      : mode==='nerve'
      ? `Each node is an <b>irreducible component</b>; the center is the <b>minimal cell</b> every component
         contains. An edge joins two components that share cells, thicker when they share more.<br><br>`
      : `Each sphere is a <b>cell</b>, stacked by <b>dimension</b> — the <b>minimal cell</b> at the bottom,
         the <b>components</b> (top cells) at the top. Downward edges are <b>boundary attachments</b>.<br><br>`;
    panel.innerHTML = `<div class="hint">${extra}<b>Click a component</b> to light up its whole closure and
      see exactly which cells it shares with each other component.</div>`;
    return;
  }
  const comp=DATA.comps[sel];
  const myset=new Set(); DATA.cells.forEach(c=>{ if((DATA.sup[c.p]||[]).includes(sel)) myset.add(c.p); });
  const rows=DATA.comps.map((q,j)=>{ if(j===sel)return null;
    const qs=new Set(); DATA.cells.forEach(c=>{ if((DATA.sup[c.p]||[]).includes(j)) qs.add(c.p); });
    let sh=0; myset.forEach(p=>{ if(qs.has(p)) sh++; }); return {q,j,sh}; })
    .filter(Boolean).sort((a,b)=>b.sh-a.sh);
  let html=`<div class="ctitle">Component ${sel+1}</div><div class="csub perm">${comp}</div>`+
    `<div class="stat"><div><b>${myset.size}</b>cells in closure</div>`+
    `<div><b>${rows.filter(r=>r.sh>0).length}</b>/${DATA.comps.length-1} neighbors meet</div></div>`+
    `<div class="hint" style="margin-bottom:12px">Cells shared with each other component (overlap of closures):</div>`;
  rows.forEach(r=>{ html+=`<div class="sharerow"><span class="nm">Component ${r.j+1}</span><span class="ct">${r.sh}</span></div>`; });
  html+=`<button class="reset" id="reset">Clear selection</button>`;
  panel.innerHTML=html;
  document.getElementById('reset').onclick=()=>{ sel=-1; renderPanel(); draw(); };
}

// ---------- hit testing ----------
function invT(px,py){ return [ (px-W/2-view.x)/view.s + W/2, (py-H/2-view.y)/view.s + H/2 ]; }
function pick(px,py){
  if(mode==='attach'){ const [x,y]=invT(px,py); let best=null,bd=1e9;
    for(const c of DATA.cells){ const N=layout.node[c.p]; if(!N)continue;
      const dd=(N.x-x)**2+(N.y-y)**2; if(dd<bd){bd=dd;best=c.p;} }
    if(best && bd<(layout.rad+7)**2) return {type:'cell',p:best}; }
  else if(mode==='nerve'){ const [x,y]=invT(px,py); const comps=DATA.comps;
    for(let i=0;i<comps.length;i++){ const N=nerveLayout.npos[comps[i]];
      if((N.x-x)**2+(N.y-y)**2<16**2) return {type:'comp',i}; } }
  else { // shell: pick nearest projected (front-biased)
    let best=null,bd=1e9;
    for(const c of DATA.cells){ const P=proj(shell.P3[c.p]);
      const r=Math.max(3,P.sc*4.5);
      const dd=(P.sx-px)**2+(P.sy-py)**2; if(dd<r*r*4 && dd - P.depth<bd){ bd=dd - P.depth; best=c.p; } }
    if(best) return {type:'cell',p:best}; }
  return null;
}

cv.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,ry:rotY,rx:rotX,moved:false}; });
addEventListener('mouseup',e=>{
  if(drag && !drag.moved){
    const r=cv.getBoundingClientRect();
    const hit=pick(e.clientX-r.left,e.clientY-r.top);
    if(hit){ if(hit.type==='comp') sel=hit.i;
      else { const idx=DATA.comps.indexOf(hit.p); sel = idx>=0?(sel===idx?-1:idx):sel; }
      renderPanel(); draw(); }
  }
  drag=null;
});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    if(mode==='shell'){ rotY=drag.ry+dx*0.008; rotX=drag.rx+dy*0.008;
      rotX=Math.max(-1.4,Math.min(1.4,rotX)); if(!raf) draw(); }
    else { view.x=drag.vx+dx; view.y=drag.vy+dy; draw(); } return; }
  const hit=pick(mx,my); let nh=null, txt='';
  if(hit){ if(hit.type==='cell'){ nh=hit.p; const c=DATA.cells.find(z=>z.p===hit.p);
      const tag = DATA.core.includes(c.p)?' · minimal':(DATA.comps.includes(c.p)?' · component':'');
      txt=`<b>${c.p}</b> · dim ${c.d} · ${c.f} free${tag}`; }
    else { nh='N'+hit.i; txt=`<b>Component ${hit.i+1}</b> · ${DATA.comps[hit.i]}`; } }
  if(nh!==hover){ hover=nh; if(!raf) draw(); }
  if(hit){ tip.style.opacity=1; tip.innerHTML=txt; tip.style.left=(mx+14)+'px'; tip.style.top=(my+12)+'px';
    cv.style.cursor= mode==='shell'?'grab':'pointer'; }
  else { tip.style.opacity=0; cv.style.cursor= mode==='shell'?(drag?'grabbing':'grab'):(drag?'grabbing':'default'); }
});
cv.addEventListener('wheel',e=>{ e.preventDefault();
  if(mode==='shell'){ zoom3=Math.max(.4,Math.min(3,zoom3*Math.exp(-e.deltaY*0.0012))); if(!raf) draw(); }
  else { view.s=Math.max(.5,Math.min(5,view.s*Math.exp(-e.deltaY*0.0012))); draw(); }
},{passive:false});

// ---------- animation loop (shell only) ----------
function loop(){
  if(mode!=='shell'){ raf=null; return; }
  if(!drag) rotY += spin;
  draw(); raf=requestAnimationFrame(loop);
}
function startLoop(){ if(mode==='shell' && !raf) raf=requestAnimationFrame(loop); }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }

// ---------- setup ----------
function load(label){ DATA=EMBED[label]; sel=-1; view={x:0,y:0,s:1}; zoom3=1;
  computeLayout(); renderPanel(); draw(); startLoop(); }
const partSel=document.getElementById('part');
Object.keys(EMBED).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k; partSel.appendChild(o); });
partSel.value='(4,4)'; partSel.onchange=()=>load(partSel.value);
const spinwrap=document.getElementById('spinwrap'), spinEl=document.getElementById('spin');
spinEl.oninput=()=>{ spin=0.0001+spinEl.value/100*0.009; };
spin=0.0001+spinEl.value/100*0.009;
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m; view={x:0,y:0,s:1};
  spinwrap.style.display = mode==='shell'?'flex':'none';
  stopLoop(); renderPanel(); draw(); startLoop();
});
resize(); load('(4,4)');
</script>
</body>
</html>
